<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amy's Singapore Adventure</title>
<link rel="stylesheet" href="amy.css">
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="bg-glow"></div>
<div class="container">
<h1 class="title">🦁 Amy's Singapore Adventure</h1>
<button class="sound-btn" id="sound-btn" onclick="toggleSound()">🔊 Sound On</button>

<div class="card boss-card" id="boss-card">
<div class="boss-bar">
<div class="boss-avatar" id="boss-avatar">🦁</div>
<div class="boss-info">
<div class="boss-name" id="boss-name">Boss: Stone Beast</div>
<div class="boss-hp"><div class="boss-hp-fill" id="boss-hp-fill" style="width:0%"></div></div>
<div class="exp-text" id="boss-hp-text">HP 0/60</div>
</div>
</div>
</div>

<div class="card">
<div class="profile">
<div class="avatar" id="avatar">🧙‍♀️</div>
<div class="profile-info">
<div class="hero-name" id="hero-name">Amy · Apprentice</div>
<div class="exp-bar"><div class="exp-fill" id="exp-fill" style="width:0%"></div></div>
<div class="exp-text" id="exp-text">Energy 0 / 60</div>
<div class="streak-text" id="streak-text">Checked in 0 days</div>
</div>
</div>
</div>

<div class="card">
<h2>📜 Daily Quests</h2>
<div id="quest-list"></div>
</div>

<div class="card">
<h2>🎒 Treasure Bag</h2>
<div class="inventory-grid" id="inventory-grid"></div>
<div class="keys-display" id="keys-display"></div>
</div>

<div class="bottom-btns">
<button class="btn btn-warning" onclick="openParentCenter()">👨‍👩‍👧 Parent</button>
<button class="btn btn-danger" onclick="resetGame()">🔄 Reset</button>
</div>
</div>

<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModalOutside(event)">
<div class="modal" id="modal-content"></div>
</div>

<script src="amy.js"></script>
</body>
</html>
